# El backend arma las URLs absolutas de las imágenes con estos headers.
# Detrás de un túnel HTTPS (Cloudflare) llega X-Forwarded-Proto: https y no
# hay que anunciar puerto; en acceso directo se anuncia el publicado. Si se
# fijara 18089 siempre, las imágenes saldrían como http://host:18089 y el
# navegador las bloquearía por contenido mixto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_proto $forwarded_port {
    default "";
    ""      18089;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Mismo origen para el navegador: evita CORS y URLs fijas en el build.
    location /api/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    location /webhooks/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML no se cachea: tras un despliegue el navegador debe pedir el
    # index nuevo para cargar el bundle con hash actualizado.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
