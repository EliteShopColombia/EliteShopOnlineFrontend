server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Mismo origen para el navegador: evita CORS y URLs fijas en el build.
    location /api/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Debe coincidir con DEMO_PORT del compose.
        proxy_set_header X-Forwarded-Port 18089;
    }

    location /webhooks/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Debe coincidir con DEMO_PORT del compose.
        proxy_set_header X-Forwarded-Port 18089;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML no se cachea: tras un despliegue el navegador debe pedir el
    # index nuevo para cargar el bundle con hash actualizado.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
